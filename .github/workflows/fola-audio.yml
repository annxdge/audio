name: Fola audio

on:
  schedule:
    - cron: "17 * * * *"        # every hour; new posts get their recording within the hour
  workflow_dispatch:             # and the "Run workflow" button in the Actions tab, for right now

permissions:
  contents: write

concurrency:
  group: fola-audio
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install "google-genai>=2.25.0"

      - name: Make the missing recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}          # optional: only if the voice is not found by its name
          VOICE_NAME: ${{ vars.VOICE_NAME || 'Fola' }}
          TTS_STYLE: ${{ vars.TTS_STYLE }}         # optional: a style note for the voice
        run: python make_audio.py

      - name: Save them in the repository
        run: |
          git config user.name "Fola audio"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.mp3'
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "New Fola recordings" && git push; fi
